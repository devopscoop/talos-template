# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The siderolabs/talos provider. Read its release notes before merging: a
  # provider bump can change generated machine configs.
  - package-ecosystem: terraform
    directory: /cluster
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a bad or compromised
    # release has time to be noticed and yanked.
    # https://docs.zizmor.sh/audits/#dependabot-cooldown
    cooldown:
      default-days: 7
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
